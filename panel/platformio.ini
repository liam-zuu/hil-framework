; Panel TFT of the HIL box, level M2 (QĐ 17, QĐ 22).
; ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM), WeAct board; ST7796 3.5" SPI; Arduino + TFT_eSPI.
; Pins: src/pins.h ([ĐỀ XUẤT], not confirmed). Protocol v6: lib/panel_proto (checked on the PC
; by panel/test_host against rpi5/panel_proto.py).
;
;   pio run -e panel_s3            build, protocol on UART1 to the RPi5 (pins.h)
;   pio run -e panel_s3_usb        build, protocol on the USB port (fake Pi on the PC)
;   pio run -e panel_s3_usb -t upload

[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -Wall

[env:panel_s3]
build_flags =
    ${env.build_flags}
    -DPANEL_LINK_USB=0

[env:panel_s3_usb]
build_flags =
    ${env.build_flags}
    -DPANEL_LINK_USB=1
